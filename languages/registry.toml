# The language registry. build.rs turns this into the Language enum, the extension map and the grammar
# table. One entry per language: `name`, `extensions`, optionally `variant` (the enum variant when it is
# not the capitalised name), `filenames` (whole file names without an extension, `Makefile`), `crate` (the Rust path of the grammar's LanguageFn constant), `query` (the
# folder under languages/ when it is not the name; tsx shares typescript) and `upstream_tags = false`
# when the grammar's own tags query is not worth syncing. An entry without `crate` is parsed by the
# regex tier.
#
# languages/<folder>/tags.scm is the upstream copy written by scripts/sync-queries; extra.scm holds the
# additions for codemap. build.rs concatenates the two.

[[language]]
name = "kotlin"
extensions = ["kt", "kts"]
crate = "tree_sitter_kotlin_ng::LANGUAGE"

[[language]]
name = "swift"
extensions = ["swift"]
crate = "tree_sitter_swift::LANGUAGE"
# upstream tags put every member on the line of its class; the extra.scm query is complete on its own
upstream_tags = false

[[language]]
name = "typescript"
variant = "TypeScript"
extensions = ["ts", "mts", "cts"]
crate = "tree_sitter_typescript::LANGUAGE_TYPESCRIPT"

[[language]]
name = "tsx"
extensions = ["tsx"]
crate = "tree_sitter_typescript::LANGUAGE_TSX"
query = "typescript"

