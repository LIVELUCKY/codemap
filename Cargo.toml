[package]
name = "codemap"
version = "0.1.0"
edition = "2024"
description = "One-step code lookup for AI coding agents: a cross-repository, cross-language index."
license = "MIT"
repository = "https://github.com/LIVELUCKY/codemap"
readme = "README.md"
keywords = ["code-search", "tree-sitter", "index", "claude-code"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
clap_complete = "4.6.11"
dirs = "7.0.0"
globset = "0.4.21"
grep-matcher = "0.1.9"
grep-regex = "0.1.14"
grep-searcher = "0.1.17"
ignore = "0.4.34"
mimalloc = "0.1.52"
nucleo = "0.5.0"
rayon = "1.12.0"
regex = "1.13.1"
rmcp = { version = "3.8.0", features = ["server", "transport-io"], default-features = false }
rusqlite = { version = "0.41.1", features = ["bundled"] }
rust-stemmers = "1.2.0"
serde = { version = "1.0.229", features = ["derive"] }
# preserve_order: `codemap setup` rewrites agents' config files without reordering their keys.
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha1_smol = "1.0.1"
shlex = "2.0.1"
strsim = "0.11.1"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt", "io-std"], default-features = false }
toml = "1.1.8"
tree-sitter = "0.27.1"
tree-sitter-bash = "0.25.1"
tree-sitter-c = "0.24.2"
tree-sitter-c-sharp = "0.23.5"
tree-sitter-cpp = "0.23.4"
tree-sitter-css = "0.25.0"
tree-sitter-dart = "0.3.0"
tree-sitter-elixir = "0.3.5"
tree-sitter-go = "0.25.0"
tree-sitter-graphql = "0.3.0"
tree-sitter-haskell = "0.24.1"
tree-sitter-hcl = "1.1.0"
tree-sitter-html = "0.23.2"
tree-sitter-java = "0.23.5"
tree-sitter-javascript = "0.25.0"
tree-sitter-json = "0.24.8"
tree-sitter-kotlin-ng = "1.1.0"
tree-sitter-lua = "0.5.0"
tree-sitter-make = "1.1.1"
tree-sitter-md = "0.5.4"
tree-sitter-objc = "3.0.2"
tree-sitter-ocaml = "0.26.0"
tree-sitter-php = "0.25.1"
tree-sitter-proto = "0.6.0"
tree-sitter-python = "0.25.0"
tree-sitter-ruby = "0.23.1"
tree-sitter-rust = "0.24.2"
tree-sitter-scala = "0.26.3"
tree-sitter-sequel = "0.3.12"
tree-sitter-swift = "0.7.4"
tree-sitter-toml-ng = "0.7.0"
tree-sitter-typescript = "0.23.2"
tree-sitter-xml = "0.7.0"
tree-sitter-yaml = "0.7.2"
tree-sitter-zig = "1.1.2"

[dev-dependencies]
tempfile = "3.27.0"
toml = "1.1.8"

[build-dependencies]
toml = "1.1.8"
